[custom]
; Mobile Clash/Mihomo config for subconverter.
; Use this file's GitHub raw URL as the config= parameter.
; Keep subscription URLs, server IPs, account tokens, and credentials out of this file.
;
; Design goal:
; - proxy-groups are generated from custom_proxy_group entries below
; - rules stay concise as RULE-SET / GEOIP / MATCH entries
; - rule-providers are defined in mobile-clash-base.yaml
; - rule order follows the common "specific first, broad fallback last" practice

clash_rule_base=https://raw.githubusercontent.com/cancanyang/config/master/subconverter/mobile-clash/mobile-clash-base.yaml

; tindy2013/subconverter emits the current SS 2022 node password without YAML
; quoting when it contains ":", which makes the final profile invalid.
; Keep this narrow so HY2 and other nodes are preserved.
exclude_remarks=^ss-

; Local/private and explicit direct rules.
ruleset=🎯 全球直连,[]RULE-SET,LocalAreaNetwork
ruleset=🎯 全球直连,[]RULE-SET,UnBan

; Blocking and app cleanup.
ruleset=🛑 广告拦截,[]RULE-SET,BanAD
ruleset=🍃 应用净化,[]RULE-SET,BanProgramAD

; AI services stay separate because they often need different stable regions.
ruleset=🤖 AI,[]RULE-SET,OpenAI
ruleset=🤖 AI,[]RULE-SET,Gemini
ruleset=🤖 AI,[]RULE-SET,MicrosoftCopilot

; Common proxy services before broad proxy lists.
ruleset=🔍 Google,[]RULE-SET,Google
ruleset=🚀 节点选择,[]RULE-SET,GitHub
ruleset=🚀 节点选择,[]RULE-SET,Telegram
ruleset=🔍 Google,[]RULE-SET,YouTube

; Large ecosystems are selectable because direct is often faster in China,
; but proxy is occasionally needed for account/login/CDN edges.
ruleset=🍎 苹果服务,[]RULE-SET,Apple
ruleset=Ⓜ️ 微软服务,[]RULE-SET,Microsoft

; User proxy list, then general GFW proxy list.
ruleset=🚀 节点选择,[]RULE-SET,ProxyGFWlist

; Domestic direct lists and final fallback.
ruleset=🎯 全球直连,[]RULE-SET,GoogleCN
ruleset=🎯 全球直连,[]RULE-SET,SteamCN
ruleset=🎯 全球直连,[]RULE-SET,ChinaDomain
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]MATCH

; Main policy groups.
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇰🇷 韩国自动`[]🔀 手动切换`[]DIRECT`.*
custom_proxy_group=🔀 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌐 全部节点`select`.*
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]DIRECT`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🇰🇷 韩国自动`[]🔀 手动切换`.*

; Service policy groups.
custom_proxy_group=🤖 AI`select`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`[]🚀 节点选择`[]♻️ 自动选择`[]🔀 手动切换
custom_proxy_group=🔍 Google`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🔀 手动切换`[]DIRECT
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]🇺🇸 美国自动`[]🇭🇰 香港自动`[]🇸🇬 新加坡自动`[]🇯🇵 日本自动`[]🔀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]🎯 全球直连
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]🎯 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择

; Region groups. These regexes cover common Chinese/English airport node names.
custom_proxy_group=🇭🇰 香港自动`url-test`(港|香港|HK|Hong ?Kong|HKG)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡自动`url-test`(新加坡|狮城|坡|SG|Singapore|SIN)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本自动`url-test`(日本|东京|大阪|JP|Japan|Tokyo|Osaka|NRT|KIX)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国自动`url-test`(美国|美|US|USA|United ?States|America|洛杉矶|西雅图|纽约|硅谷|LAX|SFO|SEA|NYC)`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=🇹🇼 台湾自动`url-test`(台湾|台|TW|Taiwan|Taipei|TPE)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国自动`url-test`(韩国|韩|韓|KR|Korea|KOR|Seoul|首尔)`http://www.gstatic.com/generate_204`300,,50

; Replace rules from the original airport subscription.
enable_rule_generator=true
overwrite_original_rules=true
