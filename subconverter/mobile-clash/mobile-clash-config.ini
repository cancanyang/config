[custom]
; Strict mobile Clash/Mihomo config for subconverter.
; Use this file's GitHub raw URL as the config= parameter.
; Keep subscription URLs, server IPs, account tokens, and credentials out of this file.
;
; Design goal:
; - proxy-groups are generated only from custom_proxy_group entries below
; - rules are generated only from inline ruleset entries below
; - no third-party remote ruleset is expanded into the final profile

; Local/private traffic.
ruleset=DIRECT,[]DOMAIN-SUFFIX,local
ruleset=DIRECT,[]DOMAIN-SUFFIX,localhost
ruleset=DIRECT,[]DOMAIN-SUFFIX,lan
ruleset=DIRECT,[]DOMAIN,localhost
ruleset=DIRECT,[]DOMAIN,router.asus.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,miwifi.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tplogin.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,routerlogin.com
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,224.0.0.0/4,no-resolve

; AI services.
ruleset=AI,[]DOMAIN-SUFFIX,openai.com
ruleset=AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=AI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=AI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=AI,[]DOMAIN-SUFFIX,auth0.com
ruleset=AI,[]DOMAIN-SUFFIX,anthropic.com
ruleset=AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=AI,[]DOMAIN-SUFFIX,perplexity.ai

; Developer services.
ruleset=GitHub,[]DOMAIN-SUFFIX,github.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubassets.com
ruleset=GitHub,[]DOMAIN-SUFFIX,github.io
ruleset=GitHub,[]DOMAIN-SUFFIX,gitlab.com

; Messaging and media.
ruleset=Telegram,[]DOMAIN-SUFFIX,t.me
ruleset=Telegram,[]DOMAIN-SUFFIX,tdesktop.com
ruleset=Telegram,[]DOMAIN-SUFFIX,telegram.org
ruleset=Telegram,[]IP-CIDR,91.108.4.0/22,no-resolve
ruleset=Telegram,[]IP-CIDR,91.108.8.0/22,no-resolve
ruleset=Telegram,[]IP-CIDR,91.108.12.0/22,no-resolve
ruleset=Telegram,[]IP-CIDR,91.108.16.0/22,no-resolve
ruleset=Telegram,[]IP-CIDR,91.108.56.0/22,no-resolve
ruleset=Telegram,[]IP-CIDR,149.154.160.0/20,no-resolve
ruleset=YouTube,[]DOMAIN-SUFFIX,youtube.com
ruleset=YouTube,[]DOMAIN-SUFFIX,ytimg.com
ruleset=YouTube,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=Netflix,[]DOMAIN-SUFFIX,netflix.com
ruleset=Netflix,[]DOMAIN-SUFFIX,netflix.net
ruleset=Netflix,[]DOMAIN-SUFFIX,nflxext.com
ruleset=Netflix,[]DOMAIN-SUFFIX,nflximg.com
ruleset=Netflix,[]DOMAIN-SUFFIX,nflxvideo.net
ruleset=Streaming,[]DOMAIN-SUFFIX,disneyplus.com
ruleset=Streaming,[]DOMAIN-SUFFIX,hotstar.com
ruleset=Streaming,[]DOMAIN-SUFFIX,hulu.com
ruleset=Streaming,[]DOMAIN-SUFFIX,spotify.com

; Apple and Microsoft. Default policy group selection can still choose DIRECT.
ruleset=Apple,[]DOMAIN-SUFFIX,apple.com
ruleset=Apple,[]DOMAIN-SUFFIX,icloud.com
ruleset=Apple,[]DOMAIN-SUFFIX,cdn-apple.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,microsoft.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,windows.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,office.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,office365.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,live.com
ruleset=Microsoft,[]DOMAIN-SUFFIX,onedrive.com

; Common China direct domains.
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,qq.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,weixin.qq.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,alipay.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,taobao.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,tmall.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jd.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bilibili.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,douyin.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,amap.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,baidu.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,bdstatic.com

; China IP direct fallback, then final fallback.
ruleset=DIRECT,[]GEOIP,CN
ruleset=Final,[]FINAL

; Main policy groups.
custom_proxy_group=PROXY`select`[]AUTO`[]HK`[]SG`[]JP`[]US`[]TW`.*
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=Final`select`[]PROXY`[]AUTO`[]DIRECT`[]HK`[]SG`[]JP`[]US`[]TW`.*

; Service policy groups.
custom_proxy_group=AI`select`[]PROXY`[]SG`[]US`[]JP`[]HK`[]TW`.*
custom_proxy_group=Telegram`select`[]PROXY`[]SG`[]HK`[]US`[]JP`.*
custom_proxy_group=YouTube`select`[]PROXY`[]AUTO`[]HK`[]SG`[]JP`[]US`.*
custom_proxy_group=Netflix`select`[]NetflixNodes`[]PROXY`[]SG`[]JP`[]US`[]HK`.*
custom_proxy_group=Streaming`select`[]PROXY`[]AUTO`[]HK`[]SG`[]JP`[]US`[]TW`.*
custom_proxy_group=GitHub`select`[]PROXY`[]AUTO`[]DIRECT`[]HK`[]SG`[]JP`[]US`.*
custom_proxy_group=Apple`select`[]DIRECT`[]PROXY`[]AUTO
custom_proxy_group=Microsoft`select`[]DIRECT`[]PROXY`[]AUTO

; Region groups. These regexes cover common Chinese/English airport node names.
custom_proxy_group=HK`url-test`(港|香港|HK|Hong ?Kong|HKG)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=SG`url-test`(新加坡|狮城|坡|SG|Singapore|SIN)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`url-test`(日本|东京|大阪|JP|Japan|Tokyo|Osaka|NRT|KIX)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=US`url-test`(美国|美|US|USA|United ?States|America|洛杉矶|西雅图|纽约|硅谷|LAX|SFO|SEA|NYC)`http://www.gstatic.com/generate_204`300,,100
custom_proxy_group=TW`url-test`(台湾|台|TW|Taiwan|Taipei|TPE)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=NetflixNodes`select`(NF|Netflix|NETFLIX|奈飞|解锁|流媒体|Media)

; Replace rules from the original airport subscription.
enable_rule_generator=true
overwrite_original_rules=true
