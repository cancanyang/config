mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.apple.com
    - +.icloud.com
    - +.push.apple.com

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,LocalAreaNetwork,real-ip
    - RULE-SET,CustomDirect,real-ip
    - RULE-SET,GoogleCN,real-ip
    - RULE-SET,SteamCN,real-ip
    - RULE-SET,ChinaDomain,real-ip
    - GEOSITE,cn,real-ip
    - GEOSITE,apple-cn,real-ip
    - GEOSITE,icloud@cn,real-ip
    - GEOSITE,microsoft@cn,real-ip
    - DOMAIN-SUFFIX,lan,real-ip
    - DOMAIN-SUFFIX,local,real-ip
    - DOMAIN-SUFFIX,localhost,real-ip
    - DOMAIN-SUFFIX,home.arpa,real-ip
    - DOMAIN-KEYWORD,ntp,real-ip
    - DOMAIN-KEYWORD,time,real-ip
    - DOMAIN-SUFFIX,msftconnecttest.com,real-ip
    - DOMAIN-SUFFIX,msftncsi.com,real-ip
    - DOMAIN-SUFFIX,srv.nintendo.net,real-ip
    - DOMAIN-SUFFIX,stun.playstation.net,real-ip
    - DOMAIN-SUFFIX,xboxlive.com,real-ip
    - DOMAIN-SUFFIX,airplay,real-ip
    - DOMAIN-SUFFIX,dns-sd,real-ip
    - DOMAIN-SUFFIX,dns-sd.org,real-ip
    - DOMAIN-SUFFIX,ipp,real-ip
    - DOMAIN-SUFFIX,ippusb,real-ip
    - DOMAIN-SUFFIX,mesh,real-ip
    - DOMAIN-SUFFIX,test,real-ip
    - MATCH,fake-ip
  default-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 119.29.29.29
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
    domain:
      - +.google.com
      - +.facebook.com
      - +.twitter.com
      - +.youtube.com
      - +.github.com

rule-providers:
  LocalAreaNetwork:
