mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.apple.com
    - +.icloud.com
    - +.push.apple.com

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: false
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost
    - "*.localhost"
    - "*.home.arpa"
    - msftconnecttest.com
    - "*.msftconnecttest.com"
    - msftncsi.com
    - "*.msftncsi.com"
    - srv.nintendo.net
    - stun.playstation.net
    - "*.xboxlive.com"
    - "*.airplay"
    - "*.dns-sd"
    - "*.dns-sd.org"
    - "*.ipp"
    - "*.ippusb"
    - "*.mesh"
    - "*.test"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn,private,apple-cn,icloud@cn,microsoft@cn":
      - https://doh.pub/dns-query
      - tls://dns.alidns.com:853
    "geosite:category-ads-all": rcode://success
  nameserver:
    - https://doh.pub/dns-query
    - tls://dns.alidns.com:853
  direct-nameserver:
    - https://doh.pub/dns-query
    - tls://dns.alidns.com:853
    - 119.29.29.29
  direct-nameserver-follow-policy: true
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - tls://dns.alidns.com:853
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
      - google
      - youtube
      - netflix
      - openai
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.youtube.com
      - +.netflix.com
      - +.openai.com
      - +.chatgpt.com

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53

rule-providers:
  LocalAreaNetwork:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
    path: ./ruleset/LocalAreaNetwork.list
    interval: 86400
  UnBan:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
    path: ./ruleset/UnBan.list
    interval: 86400
  CustomDirect:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/cancanyang/config/master/subconverter/mobile-clash/rules/custom-direct.yaml
    path: ./ruleset/custom-direct.yaml
    interval: 86400
  BanAD:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
    path: ./ruleset/BanAD.list
